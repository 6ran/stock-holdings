<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Stock Holdings</title>
<meta name="theme-color" content="#F3F4F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, fixed bottom tab bar; detail opens as a full-height sheet. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#16202A; --soft:#5B6670; --faint:#8A949C; --line:#DCE0DA;
  --accent:#1D4FD8; --accent-ink:#FFFFFF; --up:#17804B; --down:#B8322A; --warn:#A86A0A; --warn-bg:#FBF0DC; --down-bg:#FBE6E3; --info-bg:#E6ECFB;
  --s-vfv:#2A6FDB; --s-spy:#D9622B; --s-wmt:#7651CC; --s-finn:#12946E; --s-nflx:#C99400; --s-amzn:#CF3F76; --s-sony:#55697A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161D23; --sunk:#1C252C; --ink:#E7ECEA; --soft:#A2ADB3; --faint:#76828A; --line:#26313A;
  --accent:#7DA2FF; --accent-ink:#0E1317; --up:#46C27F; --down:#F07468; --warn:#E3A945; --warn-bg:#2E2414; --down-bg:#331A18; --info-bg:#18223A;
  --s-vfv:#6C9CF0; --s-spy:#F08A55; --s-wmt:#A487EE; --s-finn:#3CC79A; --s-nflx:#E8B92E; --s-amzn:#EE6FA0; --s-sony:#93A7B7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161D23; --sunk:#1C252C; --ink:#E7ECEA; --soft:#A2ADB3; --faint:#76828A; --line:#26313A;
  --accent:#7DA2FF; --accent-ink:#0E1317; --up:#46C27F; --down:#F07468; --warn:#E3A945; --warn-bg:#2E2414; --down-bg:#331A18; --info-bg:#18223A;
  --s-vfv:#6C9CF0; --s-spy:#F08A55; --s-wmt:#A487EE; --s-finn:#3CC79A; --s-nflx:#E8B92E; --s-amzn:#EE6FA0; --s-sony:#93A7B7; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--soft)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.fresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px 8px;display:flex;flex-direction:column;gap:22px}
.view[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.005em}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h small{font-size:12px;color:var(--faint)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.note{font-size:12px;color:var(--soft);line-height:1.5;margin:0}

/* Hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1;letter-spacing:-.02em}
.hero .big .cur{font-size:.45em;color:var(--soft);font-weight:600;margin-right:4px;vertical-align:.55em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--sunk);font-size:13px}
.chip b{font-weight:500}
.chip.up b{color:var(--up)} .chip.down b{color:var(--down)}

/* Account split */
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.split span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.legend div{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.legend .k i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend .v{font-size:14px}
.legend .s{font-size:11px;color:var(--faint)}

/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.tick{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-size:10.5px;font-weight:500;color:#fff;letter-spacing:0}
.rmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.rmain .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rmain .d{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--soft)}
.rend{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rend .v{font-size:14px}
.rend .c{font-size:12px}
.spark{display:block}

/* Alloc bars */
.alloc{display:flex;flex-direction:column;gap:9px;padding:14px}
.alloc .ar{display:grid;grid-template-columns:52px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:13px}
.alloc .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.alloc .bar i{display:block;height:100%;border-radius:4px}
.alloc .p{text-align:right;color:var(--soft)}

/* Watch-outs */
.flags{display:flex;flex-direction:column;gap:10px}
.flag{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:12px 14px 12px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.flag .stripe{background:var(--faint);border-radius:0 3px 3px 0}
.flag.high .stripe{background:var(--down)} .flag.med .stripe{background:var(--warn)} .flag.low .stripe{background:var(--accent)}
.flag .ft{font-weight:600;font-size:14px;line-height:1.35;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.flag .fb{font-size:13px;color:var(--soft);line-height:1.5;margin-top:4px}
.sev{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.high .sev{background:var(--down-bg);color:var(--down)} .med .sev{background:var(--warn-bg);color:var(--warn)} .low .sev{background:var(--info-bg);color:var(--accent)}

/* Events */
.events{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .dt{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.ev .dt b{font-family:var(--f-display);font-size:20px}
.ev .dt span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.ev .in{font-size:12px;color:var(--faint);white-space:nowrap}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-num);font-size:10px;fill:var(--faint)}
.chart .lbl{font-family:var(--f-body);font-size:11px;font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.cpanel{padding:14px;display:flex;flex-direction:column;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.toggles button i{width:8px;height:8px;border-radius:50%}
.toggles button[aria-pressed="false"]{opacity:.45}

/* Index tiles */
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.idx div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.idx .n{font-size:12px;color:var(--soft)}
.idx .v{font-size:15px}
.idx .c{font-size:12px}
.prose{font-size:14px;line-height:1.6;margin:0;color:var(--ink)}

/* Analyst table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.at{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
table.at th{text-align:left;font-size:11px;font-weight:600;color:var(--soft);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
table.at td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.at tr:last-child td{border-bottom:0}
.rate{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--info-bg);color:var(--accent)}
.range{position:relative;height:6px;width:90px;background:var(--sunk);border-radius:3px;display:inline-block;vertical-align:middle}
.range i{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px}
.disc{font-size:12px;color:var(--soft);line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--sunk);margin:0}

/* Articles */
.arts{display:flex;flex-direction:column}
.art{display:flex;flex-direction:column;gap:4px;padding:13px 14px;border-top:1px solid var(--line);text-decoration:none}
.art:first-child{border-top:0}
.art .m{font-size:11px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.art .h{font-weight:600;font-size:14.5px;line-height:1.35}
.art:hover .h{text-decoration:underline;text-underline-offset:3px}
.art .s{font-size:13px;color:var(--soft);line-height:1.5}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--soft)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-h .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:0;background:var(--sunk);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.sheet .body{display:flex;flex-direction:column;gap:20px;padding-block:18px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--soft)}
.kv b{font-weight:500;font-size:14px}
.pos{display:flex;flex-direction:column}
.pos div{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.pos div:first-child{border-top:0}

/* Empty / status */
.empty{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{font-family:var(--f-display);margin:0;font-size:18px}
.empty p{margin:0;color:var(--soft);font-size:14px;line-height:1.5;max-width:40ch}
.skel{height:14px;border-radius:7px;background:var(--sunk)}
.srcs{font-size:11px;color:var(--faint);line-height:1.7}
.srcs a{color:var(--faint)}
@media (min-width:760px){ .legend{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:rise .22s ease-out} @keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head><body>
<header class="top"><div class="wrap">
  <div class="brand">My Stock Holdings</div>
  <button class="fresh" id="fresh" aria-label="Refresh" style="border:0;background:none;cursor:pointer;padding:6px 0"><span class="dot" id="dot"></span><span id="freshTxt">Loading…</span></button>
</div></header>

<main><div class="wrap">
  <section class="view" id="v-overview" aria-label="Overview"></section>
  <section class="view" id="v-holdings" aria-label="Holdings" hidden></section>
  <section class="view" id="v-markets" aria-label="Markets" hidden></section>
  <section class="view" id="v-insights" aria-label="Insights" hidden></section>
  <section class="view" id="v-news" aria-label="News" hidden></section>
</div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Overview</button>
  <button data-tab="holdings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Holdings</button>
  <button data-tab="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8 3 3"/><path d="M3 21h18"/></svg>Markets</button>
  <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Insights</button>
  <button data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script>
(function(){
const COLORS={VFV:'--s-vfv',SPY:'--s-spy',WMT:'--s-wmt',FINN:'--s-finn',NFLX:'--s-nflx',AMZN:'--s-amzn',SONY:'--s-sony'};
const col=s=>`var(${COLORS[s]||'--faint'})`;
const $=id=>document.getElementById(id);
let D=null, tab='overview', newsFilter='All', cmpRange='1M', cmpOn=null, detailRange='All', openId=null;

/* ---------- formatting ---------- */
const nf=(n,d=2)=>Number(n).toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(n,cur,d=2)=>{const p=cur==='USD'?'US$':cur==='CAD'?'C$':'';return (n<0?'−':'')+p+nf(Math.abs(n),d)};
const signed=(n,cur,d=2)=>(n>0?'+':n<0?'−':'')+(cur==='USD'?'US$':cur==='CAD'?'C$':'')+nf(Math.abs(n),d);
const pct=(n,d=2)=>(n>0?'+':n<0?'−':'')+nf(Math.abs(n),d)+'%';
const cls=n=>n>0.0001?'up':n<-0.0001?'down':'flat';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fdate=s=>{const d=pd(s);return MON[d.getMonth()]+' '+d.getDate()};
const fdateY=s=>{const d=pd(s);return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()};
const safeUrl=u=>/^https:\/\//i.test(u||'')?u:'#';
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const daysTo=s=>Math.round((pd(s)-today())/864e5);

/* ---------- charts ---------- */
function lineChart(series,{w=340,h=170,pad={l:6,r:44,t:12,b:22},pctMode=false,fill=true,fmt=v=>nf(v)}={}){
  const all=series.flatMap(s=>s.pts.map(p=>p[1]));
  if(!all.length) return '';
  let lo=Math.min(...all), hi=Math.max(...all);
  if(pctMode){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  const span=(hi-lo)||Math.abs(hi)||1; lo-=span*.08; hi+=span*.08;
  const dates=[...new Set(series.flatMap(s=>s.pts.map(p=>p[0])))].sort();
  const xi=d=>dates.indexOf(d);
  const X=i=>pad.l+(dates.length<2?0:i*(w-pad.l-pad.r)/(dates.length-1));
  const Y=v=>pad.t+(hi-v)*(h-pad.t-pad.b)/(hi-lo);
  let g='';
  const ticks=niceTicks(lo,hi,4);
  for(const t of ticks){g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="${pctMode&&Math.abs(t)<1e-9?1.2:1}" ${pctMode&&Math.abs(t)<1e-9?'':'stroke-dasharray="2 3"'}/>`;
    g+=`<text x="${w-pad.r+6}" y="${(Y(t)+3.5).toFixed(1)}">${pctMode?(t>0?'+':'')+nf(t,Math.abs(hi-lo)<4?1:0)+'%':fmt(t)}</text>`}
  const li=[0,Math.floor((dates.length-1)/2),dates.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  for(const i of li){const anchor=i===0?'start':i===dates.length-1?'end':'middle';g+=`<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="${anchor}">${fdate(dates[i])}</text>`}
  for(const s of series){
    const P=s.pts.map(p=>[X(xi(p[0])),Y(p[1])]);
    const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(fill&&series.length===1){g+=`<path d="${d} L${P[P.length-1][0].toFixed(1)} ${h-pad.b} L${P[0][0].toFixed(1)} ${h-pad.b}Z" fill="${s.color}" opacity=".10"/>`}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${series.length>1?1.7:2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const e=P[P.length-1]; g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.2" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  }
  if(series.some(s=>s.ref!=null)){const s=series.find(s=>s.ref!=null);const y=Y(s.ref);if(y>pad.t&&y<h-pad.b)g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="${pad.l+2}" y="${(y-5).toFixed(1)}" class="lbl" style="fill:var(--warn)">${esc(s.refLabel)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} price chart">${g}</svg>`;
}
function niceTicks(lo,hi,n){const r=hi-lo;const step0=r/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||mag*10;const out=[];for(let t=Math.ceil(lo/st)*st;t<=hi+1e-9;t+=st)out.push(+t.toFixed(10));return out}
function spark(pts,w=72,h=26){if(!pts||pts.length<2)return '';const v=pts.map(p=>p[1]);const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1;const P=v.map((x,i)=>[2+i*(w-4)/(v.length-1),2+(hi-x)*(h-4)/r]);const c=v[v.length-1]>=v[0]?'var(--up)':'var(--down)';return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/></svg>`}
function sliceRange(h,r){if(!h)return[];if(r==='All')return h;const last=pd(h[h.length-1][0]);const cut=new Date(last);if(r==='1W')cut.setDate(cut.getDate()-7);if(r==='1M')cut.setMonth(cut.getMonth()-1);if(r==='2M')cut.setMonth(cut.getMonth()-2);return h.filter(p=>pd(p[0])>=cut)}

/* ---------- derived ---------- */
function derive(d){
  const fx=d.fx.usdcad;
  const A=d.assets.map(a=>({...a,qty:a.positions.reduce((s,p)=>s+p.qty,0)}));
  A.forEach(a=>{a.valueCad=a.value*(a.cur==='USD'?fx:1);a.dayPct=a.kind==='option'?(a.markPrev?(a.mark/a.markPrev-1)*100:0):(a.price/a.prev-1)*100;a.dayCad=a.dayChange*(a.cur==='USD'?fx:1)});
  const gross=A.reduce((s,a)=>s+a.valueCad,0);
  A.forEach(a=>a.weight=gross?a.valueCad/gross*100:0);
  return {A,gross,fx};
}

const DATA_URL='__DATA_URL__';
const BUNDLED='data.json';
try{const c=localStorage.getItem('msh.cache');if(c)accept(JSON.parse(c))}catch(e){}
try{const t=localStorage.getItem('msh.tab');if(t&&$('v-'+t))setTab(t)}catch(e){}
if(!D) showEmpty('Loading your holdings','Fetching the latest data. You need an internet connection the first time.');
let loading=false;
async function load(){
  if(loading) return; loading=true; setFresh('wait',D?freshLabel()+' · refreshing':'Loading…');
  const urls=DATA_URL.startsWith('http')?[DATA_URL+'?t='+Date.now(),BUNDLED]:[BUNDLED];
  for(const u of urls){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();
      const newer=!D||!D.updatedAt||!d.updatedAt||d.updatedAt>=D.updatedAt;
      if(newer&&accept(d)){try{localStorage.setItem('msh.cache',JSON.stringify(d))}catch(e){}}
      if(u!==BUNDLED){loading=false;setFresh('live',freshLabel());return}
    }catch(e){}
  }
  loading=false; setFresh('off',D?freshLabel()+' · offline':'Offline');
  if(!D) showEmpty('Can’t load your holdings','Check your internet connection, then tap the status at the top to retry.');
}
window.appRefresh=load;
window.appBack=()=>{if(openId){closeDetail();return true}if(tab!=='overview'){setTab('overview');return true}return false};
$('fresh').addEventListener('click',load);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(()=>{if(D)$('freshTxt').textContent=freshLabel()+($('dot').classList.contains('live')?'':' · offline')},60000);
load();
})();
</script>
</body></html>
