<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Stock Holdings</title>
<meta name="theme-color" content="#0F0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark, phone-first shell. Sticky header, one scrolling view per tab, fixed bottom tab bar; a holding opens as a full-screen quote sheet. */
:root{
  color-scheme:dark;
  --bg:#0F0F14; --card:#1C1C22; --card2:#26262E; --line:#2A2A33; --ink:#F2F2F5; --soft:#A3A3AE; --faint:#8A8A96; --mute:#55555F;
  --accent:#7B3FF2; --accent-soft:#2E2A3D; --accent-ink:#D3BEFF; --accent-txt:#B794FF;
  --up:#3DD68C; --down:#FF5A6A; --up-fill:#00873C; --down-fill:#D50C24; --flat-fill:#3A3A44;
  --up-bg:#12301F; --down-bg:#3A1419; --warn:#F0A35E; --warn-bg:#5A3A0A; --warn-ink:#FFC36B;
  --nav:#16161C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent-txt);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-txt);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--soft)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:0;z-index:20;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
header.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.fresh{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--soft);white-space:nowrap;min-height:36px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--up)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:20px;padding-block:8px 8px}
h2{margin:0;font-size:18px;font-weight:800}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h small{font-size:12px;color:var(--soft)}
.sec-h a,.linkbtn{font-size:13px;font-weight:600;color:var(--accent-txt);background:none;border:0;padding:0}
.card{background:var(--card);border-radius:16px}
.pad{padding:16px}
.note{margin:0;font-size:12px;line-height:1.5;color:var(--soft)}
.disc{margin:0;font-size:12px;line-height:1.5;color:var(--soft);background:var(--card);border-radius:12px;padding:12px 14px}
.prose{margin:0;font-size:14px;line-height:1.6;color:#D6D6DD}
.srcs{margin:0;font-size:11px;color:var(--faint);line-height:1.7}
.srcs a{color:var(--faint);text-decoration:underline}

/* change pill */
.pill{flex:none;display:inline-block;min-width:70px;text-align:center;padding:6px 6px;border-radius:6px;font-size:13px;font-weight:700;color:#fff;background:var(--flat-fill)}
.pill.up{background:var(--up-fill);color:#fff} .pill.down{background:var(--down-fill);color:#fff}
.ttag{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--soft)}
.ttag.up{background:var(--up-bg);color:var(--up)} .ttag.down{background:var(--down-bg);color:#FF7A86}
.calltag{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);letter-spacing:.03em}

/* markets */
.idx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.idx3>div{min-width:0;background:var(--card);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.idx3 .n{font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx3 .v{font-size:14px;font-weight:700;white-space:nowrap}
.idx3 .c{font-size:13px;font-weight:700}

/* portfolio card */
.pf{display:flex;flex-direction:column;gap:12px}
.pf-h{display:flex;justify-content:space-between;align-items:center}
.pf-h .l{display:flex;align-items:center;gap:2px}
.pf-h h2{font-size:16px;font-weight:700}
.eye{width:44px;height:44px;margin:-10px 0;border:0;border-radius:50%;background:transparent;color:var(--soft);display:grid;place-items:center}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.gains{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--soft)}
.gains b{font-size:14px;font-weight:700}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 10px Inter,sans-serif;fill:var(--faint)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--soft)}
.ranges{display:flex;gap:4px}
.ranges button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:8px;font-weight:600;font-size:13px;color:var(--soft);min-height:36px}
.ranges button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

/* list rows */
.colh{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:6px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .s{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.row .d{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{flex:none;width:80px;text-align:right;font-weight:600;font-size:15px}
.spark{flex:none;display:block}

/* tables */
.tbl-h,.tbl-r{display:grid;grid-template-columns:minmax(0,1fr) 104px 72px;gap:8px;align-items:center}
.tbl-h{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:6px 0;border-bottom:1px solid var(--line)}
.tbl-h span:not(:first-child){text-align:right}
.tbl-r{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.tbl-r .m{min-width:0;display:flex;flex-direction:column;gap:3px}
.tbl-r .m b{font-weight:700}
.tbl-r .m span{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-r .v{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tbl-r .v b{font-weight:600;font-size:14px}
.tbl-r .v span{font-size:11px;color:var(--soft)}
.tbl-r .pill{justify-self:end}

/* tabs */
.utabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.utabs button{border:0;background:transparent;padding:12px 0;margin-bottom:-1px;font-weight:600;font-size:15px;color:var(--faint);border-bottom:3px solid transparent;min-height:44px}
.utabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sum div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sum span{font-size:12px;color:var(--soft)}
.sum b{font-size:20px;font-weight:800}
.sum b.sm{font-size:16px;font-weight:700}
.alloc-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.alloc-bar span{display:block;height:100%}
.alloc-lg{display:flex;flex-wrap:wrap;gap:8px 14px}
.alloc-lg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.alloc-lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.alloc-lg b{color:var(--ink);font-weight:600}
.acct{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.acct .m{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.acct .m b{font-weight:700}
.acct .m span{font-size:12px;color:var(--soft)}
.acct .v{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.acct .v b{font-weight:700}
.acct .v span{font-size:12px;font-weight:700}

/* events + articles */
.ev{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev .dt{width:40px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ev .dt b{font-size:19px;font-weight:800}
.ev .dt span{font-size:10px;font-weight:600;color:var(--soft);letter-spacing:.06em}
.ev .t{flex:1;font-size:14px}
.ev .in{font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap}
.ev .in.soon{color:#fff;background:var(--down-fill);padding:3px 8px;border-radius:6px}
.art{display:flex;flex-direction:column;gap:7px;padding:15px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.art .m{font-size:12px;color:var(--soft)}
.art .m b{color:var(--ink);font-weight:700}
.art .h{font-weight:800;font-size:16px;line-height:1.3}
.art.lead .h{font-size:21px}
.art .s{font-size:13px;line-height:1.5;color:var(--soft)}
.art .tg{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid #3A3A44;background:transparent;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--ink);min-height:40px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* insights */
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lv button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid transparent;text-align:left}
.lv button[aria-pressed="true"]{border-color:var(--accent)}
.lv b{font-size:20px;font-weight:800}
.lv span{font-size:12px;font-weight:600;color:var(--soft)}
.flag{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.flag .top{display:flex;align-items:center;gap:8px}
.sev{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.sev.high{background:var(--down-fill);color:#fff} .sev.med{background:var(--warn-bg);color:var(--warn-ink)} .sev.low{background:var(--accent-soft);color:var(--accent-ink)}
.flag .sym{font-size:12px;font-weight:700;color:var(--accent-ink)}
.flag .t{font-weight:700;font-size:15px;line-height:1.35}
.flag .b{font-size:13px;line-height:1.5;color:var(--soft)}
.an{display:flex;flex-direction:column;gap:12px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.an-g{display:grid;grid-template-columns:minmax(0,1fr) 80px 72px;gap:8px;align-items:center}
.an-g .m{display:flex;flex-direction:column;gap:3px;min-width:0}
.an-g .m b{font-weight:700}
.an-g .m span{font-size:12px;color:var(--soft)}
.an-g .t{text-align:right;font-weight:600}
.an-g .pill{justify-self:end}
.rbar{position:relative;height:4px;border-radius:2px;background:var(--line)}
.rbar i{position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:3px solid var(--bg)}
.rlab{display:flex;justify-content:space-between;font-size:11px;color:var(--soft)}

/* mood */
.gauge-c{display:flex;flex-direction:column;align-items:center;gap:4px}
.gauge-c .lbl{align-self:flex-start;font-size:13px;font-weight:600;color:var(--soft)}
.gauge-c .val{font-size:40px;font-weight:800;line-height:1}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two>*{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.two .k{font-size:12px;font-weight:600;color:var(--soft)}
.two .v{font-size:24px;font-weight:800;line-height:1}
.two .s{font-size:11px;color:var(--soft);line-height:1.4}
.stack{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%}
.crowd{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.crowd .r1{display:flex;align-items:center;gap:10px}
.crowd .sym{font-weight:700;width:52px}
.crowd .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.crowd .bar i{display:block;height:100%;border-radius:3px}
.crowd .sc{width:28px;text-align:right;font-weight:800}
.lab{flex:none;min-width:70px;text-align:center;padding:5px 6px;border-radius:6px;font-size:12px;font-weight:700}
.lab.bull{background:var(--up-fill);color:#fff} .lab.bear{background:var(--down-fill);color:#fff} .lab.mixed{background:var(--warn-bg);color:var(--warn-ink)} .lab.na{background:var(--card2);color:var(--soft)}
.crowd .take{font-size:13px;line-height:1.5;color:var(--soft);margin:0}
details.bb summary{font-size:13px;font-weight:600;color:var(--accent-txt);cursor:pointer;list-style:none;min-height:32px;display:flex;align-items:center}
details.bb summary::-webkit-details-marker{display:none}
.says{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.says h4{margin:0 0 4px;font-size:12px}
.says ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:#D6D6DD}
.says .b h4{color:var(--up)} .says .r h4{color:var(--down)}
@media (max-width:380px){.says{grid-template-columns:1fr}}

/* trending */
.tr{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tr-h{display:flex;align-items:center;gap:12px}
.rk{width:34px;display:flex;flex-direction:column;align-items:center;line-height:1}
.rk b{font-size:18px;font-weight:800}
.rk span{font-size:9px;color:var(--soft);letter-spacing:.06em;margin-top:2px}
.tr-h .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tr-h .sub{font-size:12px;color:var(--soft)}
.tr-h .px{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tr p{margin:0;font-size:13px;line-height:1.5;color:#D6D6DD}
.tr .why b{display:block;font-size:12px;color:var(--accent-ink);margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.mpill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--soft)}
.dr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--soft)}
.dr .bar{flex:1;position:relative;height:4px;border-radius:2px;background:var(--line)}
.dr .bar i{position:absolute;top:-4px;width:4px;height:12px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.tr-f{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--soft)}

/* quote sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg)}
.sheet-h .wrap{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:8px;padding-right:8px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.sheet-h .ttl{flex:1;text-align:center;display:flex;flex-direction:column}
.sheet-h .ttl b{font-weight:800;font-size:16px}
.sheet-h .ttl span{font-size:12px;color:var(--soft)}
.qbody{display:flex;flex-direction:column;gap:20px;padding-block:6px 20px}
.qprice{display:flex;flex-direction:column;gap:4px}
.qprice .nm{font-size:14px;color:var(--soft)}
.qprice .line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qprice .px{font-size:38px;font-weight:800;letter-spacing:-.02em}
.qprice .ch{font-size:16px;font-weight:700}
.qprice .at{font-size:12px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
.stats div{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.stats span{color:var(--soft)}
.stats b{font-weight:600;text-align:right}
.pos-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pos-h h2{font-size:16px;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tri div{background:var(--card2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tri span{font-size:11px;color:var(--soft)}
.tri b{font-weight:700;font-size:14px}
.tgt{position:relative;height:64px;margin-inline:8px}
.tgt .track{position:absolute;left:0;right:0;top:30px;height:4px;border-radius:2px;background:var(--line)}
.tgt .band{position:absolute;top:30px;height:4px;border-radius:2px;background:#3A3A44}
.tgt .dot{position:absolute;top:24px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid var(--bg)}
.tgt .tl{position:absolute;top:0;font-size:11px;font-weight:700;white-space:nowrap;transform:translateX(-50%)}
.tgt .bl{position:absolute;top:46px;font-size:11px;color:var(--soft);white-space:nowrap;transform:translateX(-50%)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-block:6px 8px;padding-left:4px;padding-right:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint);min-height:52px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{color:var(--accent);stroke-width:2.4}

.empty{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0;color:var(--soft);font-size:14px;line-height:1.5;max-width:40ch}
.skel{height:14px;border-radius:7px;background:var(--card2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
</style></head><body>

<header class="top"><div class="wrap">
  <h1 id="title">Home</h1>
  <button class="fresh" id="fresh" type="button" aria-label="Refresh data"><span class="dot" id="dot"></span><span id="freshTxt">Loading…</span></button>
</div></header>

<main><div class="wrap">
  <section class="view" id="v-home" aria-label="Home"></section>
  <section class="view" id="v-portfolio" aria-label="Portfolio" hidden></section>
  <section class="view" id="v-insights" aria-label="Insights" hidden></section>
  <section class="view" id="v-mood" aria-label="Mood" hidden></section>
  <section class="view" id="v-trending" aria-label="Trending" hidden></section>
  <section class="view" id="v-news" aria-label="News" hidden></section>
</div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20H5z"/></svg>Home</button>
  <button type="button" data-tab="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Portfolio</button>
  <button type="button" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3z"/><path d="M9.5 20.5h5"/></svg>Insights</button>
  <button type="button" data-tab="mood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/></svg>Mood</button>
  <button type="button" data-tab="trending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 .9-3.4 2-4.5.2 1.7 1 2.8 2.2 3.3C10.8 9 11 6 12 3z"/></svg>Trending</button>
  <button type="button" data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const TITLES={home:'Home',portfolio:'Portfolio',insights:'Insights',mood:'Mood',trending:'Trending',news:'News'};
let D=null, tab='home', hidden=true, pfTab='hold', insTab='watch', lvl='all', newsFilter='All', trFilter='All', homeRange='All', qRange='1M', openId=null;

/* ---------- formatting ---------- */
const nf=(n,d=2)=>Number(n).toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const cur=c=>c==='USD'?'US$':c==='CAD'?'C$':'';
const money=(n,c,d=2)=>(n<0?'−':'')+cur(c)+nf(Math.abs(n),d);
const signed=(n,c,d=2)=>(n>0?'+':n<0?'−':'')+cur(c)+nf(Math.abs(n),d);
const pct=(n,d=2)=>(n>0?'+':n<0?'−':'')+nf(Math.abs(n),d)+'%';
const cls=n=>n>0.0001?'up':n<-0.0001?'down':'flat';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const fdate=s=>{const d=pd(s);return MON[d.getMonth()]+' '+d.getDate()};
const fdateY=s=>{const d=pd(s);return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()};
const safeUrl=u=>/^https:\/\//i.test(u||'')?u:'#';
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const daysTo=s=>Math.round((pd(s)-today())/864e5);
const compact=n=>n>=1e6?nf(n/1e6,1)+'M':n>=1e3?nf(n/1e3,1)+'K':String(n);
const MASK='••••••';
const hm=(s)=>hidden?MASK:s;           /* hide a portfolio dollar amount */
const ALLOC_COLS=['var(--accent)','#B794FF','#3DD68C','#1E8F5A','#F0A35E','#FF5A6A','#8A8A96','#6C9CF0','#E8B92E'];

/* ---------- icons ---------- */
const EYE_OFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.5 6.6A16 16 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.2-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const EYE_ON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeBtn=()=>`<button type="button" class="eye" data-eye="1" aria-pressed="${hidden}" aria-label="${hidden?'Show portfolio amounts':'Hide portfolio amounts'}">${hidden?EYE_OFF:EYE_ON}</button>`;

/* ---------- charts ---------- */
function niceStep(r){const s0=r/4;const mag=Math.pow(10,Math.floor(Math.log10(s0||1)));return [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=s0)||mag*10}
/* pts: [[date,value]...]; refs: [{v,color,label,dash}] */
function chart(pts,{w=340,h=180,axis=true,refs=[],fmt=v=>nf(v,v>=100?0:2)}={}){
  if(!pts||pts.length<2) return '<p class="note">Not enough history for this range.</p>';
  const vals=pts.map(p=>p[1]);
  const all=vals.concat(refs.map(r=>r.v));
  let lo=Math.min(...all), hi=Math.max(...all); const pad=((hi-lo)||Math.abs(hi)||1)*.08; lo-=pad; hi+=pad;
  const R=axis?40:0, t=8, b=8, cw=w-R;
  const X=i=>i*cw/(pts.length-1), Y=v=>t+(hi-v)*(h-t-b)/(hi-lo);
  const up=vals[vals.length-1]>=vals[0]; const col=up?'var(--up)':'var(--down)';
  let g='';
  if(axis){const st=niceStep(hi-lo);for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){const y=Y(v).toFixed(1);g+=`<line x1="0" x2="${cw}" y1="${y}" y2="${y}" stroke="#24242C"/><text x="${cw+6}" y="${(+y+3.5).toFixed(1)}">${esc(fmt(v))}</text>`}}
  for(const r of refs){const y=Y(r.v).toFixed(1);g+=`<line x1="0" x2="${cw}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-width="1.2" stroke-dasharray="${r.dash||'2 4'}"/>`;if(r.label)g+=`<text x="4" y="${(+y-6).toFixed(1)}" style="font-weight:700;fill:${r.color}">${esc(r.label)}</text>`}
  const P=pts.map((p,i)=>[X(i),Y(p[1])]);
  const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  g+=`<path d="${d} L${cw} ${h} L0 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const e=P[P.length-1]; g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Price chart">${g}</svg>`;
}
function spark(pts,w=60,h=28){if(!pts||pts.length<2)return '<span style="width:60px"></span>';const v=pts.slice(-30).map(p=>p[1]);const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1;const P=v.map((x,i)=>[2+i*(w-4)/(v.length-1),3+(hi-x)*(h-6)/r]);const c=v[v.length-1]>=v[0]?'var(--up)':'var(--down)';return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`}
function sliceRange(hist,r){if(!hist||!hist.length)return[];if(r==='All')return hist;if(r==='5D')return hist.slice(-5);const last=pd(hist[hist.length-1][0]);const cut=new Date(last);if(r==='1M')cut.setMonth(cut.getMonth()-1);if(r==='2M')cut.setMonth(cut.getMonth()-2);return hist.filter(p=>pd(p[0])>=cut)}
const rangeBtns=(list,sel,attr)=>`<div class="ranges" role="group" aria-label="Range">${list.map(r=>`<button type="button" data-${attr}="${r}" aria-pressed="${r===sel}">${r}</button>`).join('')}</div>`;

/* ---------- derived ---------- */
function derive(d){
  const fx=d.fx.usdcad;
  const A=d.assets.map(a=>({...a,qty:a.positions.reduce((s,p)=>s+p.qty,0)}));
  A.forEach(a=>{
    a.valueCad=a.valueCad!=null?a.valueCad:a.value*(a.cur==='USD'?fx:1);
    a.stockPct=a.prev?(a.price/a.prev-1)*100:0;
    a.dayPct=a.kind==='option'?(a.markPrev?(a.mark/a.markPrev-1)*100:0):a.stockPct;
  });
  const gross=A.reduce((s,a)=>s+a.valueCad,0);
  A.forEach(a=>a.weight=gross?a.valueCad/gross*100:0);
  const t=d.totals||{};
  const margin=t.marginDebitCad!=null?t.marginDebitCad:(t.marginDebitUsd!=null?t.marginDebitUsd*fx:null);
  return {A,gross,fx,margin};
}
const fk=k=>k%1?nf(k):String(k);
const optLabel=a=>`${a.underlying?a.underlying.split(' ')[0].replace(/,$/,''):a.sym} · $${fk(a.strike)} ${MON[pd(a.expiry).getMonth()]} ’${a.expiry.slice(2,4)}`;
const rating=an=>an.rating&&an.rating!=='None'?an.rating:'No consensus';
function idxVal(i){return i.unit==='%'?nf(i.close)+'%':i.unit==='$'?'$'+nf(i.close):nf(i.close)}
function idxChg(i){if(i.chgPct!=null)return [pct(i.chgPct),cls(i.chgPct)];const bp=i.chgBp||0;return [(bp>0?'+':bp<0?'−':'')+Math.abs(bp)+' bp','flat']}
const evIn=n=>n===0?'Today':n===1?'Tomorrow':'In '+n+' days';
function evHtml(e){const d=pd(e.date);const n=daysTo(e.date);return `<div class="ev"><span class="dt"><b>${d.getDate()}</b><span>${MON[d.getMonth()].toUpperCase()}</span></span><span class="t">${esc(e.title)}</span><span class="in ${n<=1&&e.sym?'soon':''}">${evIn(n)}</span></div>`}
function symChg(sym){const a=D.assets.find(x=>x.sym===sym&&x.prev);return a?(a.price/a.prev-1)*100:null}
function tagHtml(s){const c=symChg(s);return `<span class="ttag num ${c==null?'':cls(c)}">${esc(s)}${c==null?'':' '+pct(c)}</span>`}
function artHtml(a,lead){return `<a class="art${lead?' lead':''}" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener"><span class="m"><b>${esc(a.src)}</b> · ${esc(fdate(a.date))}</span><span class="h">${esc(a.title)}</span>${a.summary?`<span class="s">${esc(a.summary)}</span>`:''}${(a.syms||[]).length?`<span class="tg">${a.syms.map(tagHtml).join('')}</span>`:''}</a>`}
const LV={high:'Act soon',med:'Watch',low:'FYI'};
function flagHtml(w){return `<div class="card flag"><div class="top"><span class="sev ${esc(w.level)}">${LV[w.level]||'FYI'}</span>${w.sym?`<span class="sym">${esc(w.sym)}</span>`:''}</div><span class="t">${esc(w.title)}</span><span class="b">${esc(w.body)}</span></div>`}

/* ---------- Home ---------- */
function holdingRows(A){
  /* one row per underlying symbol, ETFs/stocks first */
  const seen=new Map();
  [...A].sort((a,b)=>(a.kind==='option')-(b.kind==='option')||b.valueCad-a.valueCad).forEach(a=>{if(!seen.has(a.sym))seen.set(a.sym,a)});
  return [...seen.values()].map(a=>{
    const isOpt=a.kind==='option';
    const sub=isOpt?optLabel(a):a.name;
    return `<button type="button" class="row" data-open="${esc(a.id)}"><span class="m"><span class="s">${esc(a.sym)}${isOpt?'<span class="calltag">CALL</span>':''}</span><span class="d">${esc(sub)}</span></span>${spark(a.history)}<span class="p num">${a.cur==='CAD'?'C$':''}${nf(a.price)}</span><span class="pill num ${cls(a.stockPct)}">${pct(a.stockPct)}</span></button>`;
  }).join('');
}
function renderHome(){
  const v=$('v-home'); const {A}=derive(D); const t=D.totals; const m=D.market||{};
  const ix=m.indexes||[];
  const vh=sliceRange(D.valueHistory||[],homeRange);
  const base=vh.length?vh[0][1]:null;
  const dayPct=t.netCad-t.dayCad?t.dayCad/(t.netCad-t.dayCad)*100:0;
  const rangeChg=vh.length>1?vh[vh.length-1][1]-vh[0][1]:null;
  const up=(D.events||[]).filter(e=>daysTo(e.date)>=0).slice(0,4);
  const arts=[...(D.articles||[])].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  v.innerHTML=`
  ${ix.length?`<section class="sec" aria-label="Markets"><div class="sec-h"><h2>Markets</h2><small>At close · ${esc(fdate(m.date||D.asOf))}</small></div>
    <div class="idx3">${ix.slice(0,6).map(i=>{const [c,k]=idxChg(i);return `<div><span class="n">${esc(i.name.replace(/\s*\(.*\)/,''))}</span><span class="v num">${idxVal(i)}</span><span class="c num ${k}">${c}</span></div>`}).join('')}</div>
  </section>`:''}
  <section class="card pad pf" aria-label="My portfolio">
    <div class="pf-h"><span class="l"><h2>My portfolio</h2>${eyeBtn()}</span><button type="button" class="linkbtn" data-go="portfolio">See all</button></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="big num">C$${hm(nf(t.netCad))}</span>
      <div class="gains"><b class="num ${cls(t.dayCad)}">${hidden?MASK:signed(t.dayCad,'',2)} (${pct(dayPct)})</b><span>Today</span>
      ${rangeChg!=null?`<b class="num ${cls(rangeChg)}" style="margin-left:6px">${hidden?MASK:signed(rangeChg,'',2)}</b><span>since ${esc(fdate(vh[0][0]))}</span>`:''}</div>
    </div>
    ${vh.length>1?chart(vh,{w:326,h:120,axis:false,refs:[{v:base,color:'#6E6E7A'}]}):'<p class="note">The chart fills in as daily values are recorded.</p>'}
    ${vh.length>1?`<div class="axis"><span>${esc(fdate(vh[0][0]))}</span><span>Dotted: ${esc(fdate(vh[0][0]))} value</span><span>${esc(fdate(vh[vh.length-1][0]))}</span></div>`:''}
    ${rangeBtns(['5D','1M','All'],homeRange,'hr')}
    ${t.wealthsimpleCad?`<p class="note">Estimate. Wealthsimple showed C$${hm(nf(t.wealthsimpleCad))} on ${esc(fdate(t.wealthsimpleAsOf))} and is the source of truth.</p>`:''}
  </section>
  <section class="sec" aria-label="My holdings" style="gap:0">
    <div class="sec-h" style="padding-bottom:6px"><h2>My holdings</h2><small>day change</small></div>
    <div class="colh"><span>Symbol</span><span>Last price</span></div>
    ${holdingRows(A)}
  </section>
  ${up.length?`<section class="sec" aria-label="Coming up" style="gap:0"><div class="sec-h" style="padding-bottom:4px"><h2>Coming up</h2></div>${up.map(evHtml).join('')}</section>`:''}
  ${arts.length?`<section class="sec" aria-label="Top stories" style="gap:0"><div class="sec-h" style="padding-bottom:4px"><h2>Top stories</h2><button type="button" class="linkbtn" data-go="news">More news</button></div>${arts.map(a=>artHtml(a,false)).join('')}</section>`:''}`;
}

/* ---------- Portfolio ---------- */
function renderPortfolio(){
  const v=$('v-portfolio'); const {A,gross,margin}=derive(D); const t=D.totals;
  const dayPct=t.netCad-t.dayCad?t.dayCad/(t.netCad-t.dayCad)*100:0;
  const sorted=[...A].sort((a,b)=>b.valueCad-a.valueCad);
  const bySym=new Map(); sorted.forEach(a=>bySym.set(a.sym,(bySym.get(a.sym)||0)+a.weight));
  const alloc=[...bySym.entries()];
  const accts=D.accounts||[];
  const held=acct=>[...new Set(A.filter(a=>a.positions.some(p=>p.acct===acct)).map(a=>a.kind==='option'?a.sym+' call':a.sym))].join(', ');
  v.innerHTML=`
  <div class="utabs" role="tablist" aria-label="Portfolio views">
    <button type="button" role="tab" data-pf="hold" aria-selected="${pfTab==='hold'}">Holdings</button>
    <button type="button" role="tab" data-pf="acct" aria-selected="${pfTab==='acct'}">Accounts</button>
  </div>
  <section class="card pad" aria-label="Summary">
    <div class="sec-h" style="margin-bottom:10px"><small>Amounts in CAD</small>${eyeBtn()}</div>
    <div class="sum">
      <div><span>Net value</span><b class="num">C$${hm(nf(t.netCad,0))}</b></div>
      <div><span>Day gain</span><b class="num ${cls(t.dayCad)}">${hidden?MASK:signed(t.dayCad,'',0)} <span style="font-size:13px;color:inherit">(${pct(dayPct)})</span></b></div>
      <div><span>Market value (gross)</span><b class="sm num">C$${hm(nf(gross,0))}</b></div>
      ${margin!=null?`<div><span>Margin loan</span><b class="sm num down">${hidden?MASK:'−C$'+nf(margin,0)}</b></div>`:''}
    </div>
  </section>
  ${pfTab==='hold'?`
  <section class="sec" aria-label="Allocation">
    <div class="alloc-bar">${alloc.map(([s,w],i)=>`<span style="width:${Math.max(w,.6).toFixed(2)}%;background:${ALLOC_COLS[i%ALLOC_COLS.length]}"></span>`).join('')}</div>
    <div class="alloc-lg">${alloc.map(([s,w],i)=>`<span><i style="background:${ALLOC_COLS[i%ALLOC_COLS.length]}"></i><b>${esc(s)}</b><span class="num">${nf(w,1)}%</span></span>`).join('')}</div>
  </section>
  <section class="sec" aria-label="Positions" style="gap:0">
    <div class="tbl-h"><span>Symbol</span><span>Mkt value</span><span>Day</span></div>
    ${sorted.map(a=>{const isOpt=a.kind==='option';const sub=isOpt?`${fdate(a.expiry)} ’${a.expiry.slice(2,4)} · ${a.contracts||a.qty} contract${(a.contracts||a.qty)>1?'s':''}`:`${nf(a.qty,a.qty%1?2:0)} ${a.kind==='etf'?'units':'shares'} · ${[...new Set(a.positions.map(p=>p.acct))].join(' + ')}`;
      return `<button type="button" class="tbl-r" data-open="${esc(a.id)}"><span class="m"><b>${esc(isOpt?a.sym+' $'+fk(a.strike)+'C':a.sym)}</b><span>${esc(sub)}</span></span><span class="v"><b class="num">${hidden?MASK:money(a.value,a.cur)}</b><span class="num">${nf(a.weight,1)}% of gross</span></span><span class="pill num ${cls(a.dayPct)}">${pct(a.dayPct)}</span></button>`}).join('')}
    <p class="note" style="margin-top:10px">Values in each holding’s trading currency. Calls show the Wealthsimple mark, so their day change only moves when the mark updates.</p>
  </section>`:`
  <section class="sec" aria-label="Accounts" style="gap:0">
    ${accts.map(a=>{const m=/([+−-][\d.,]+%)/.exec(a.note||'');return `<div class="acct"><span class="m"><b>${esc(a.name)}</b><span>${esc(held(a.name)||a.note||'')}</span></span><span class="v"><b class="num">C$${hm(nf(a.valueCad,0))}</b><span class="num ${m?(m[1].startsWith('+')?'up':'down'):'flat'}" style="${m?'':'font-weight:400;color:var(--soft)'}">${esc(a.note||'')}</span></span></div>`}).join('')}
    ${t.wealthsimpleAsOf?`<p class="note" style="margin-top:10px">Wealthsimple · ${esc(fdate(t.wealthsimpleAsOf))}. Wealthsimple is the source of truth.</p>`:''}
  </section>`}`;
}

/* ---------- Insights ---------- */
function renderInsights(){
  const v=$('v-insights'); const {A}=derive(D); const W=D.watch||[];
  const cnt=k=>W.filter(w=>w.level===k).length;
  const list=W.filter(w=>lvl==='all'||w.level===lvl);
  const rated=[...new Map(A.filter(a=>a.analyst).map(a=>[a.sym,a])).values()];
  v.innerHTML=`
  <div class="utabs" role="tablist" aria-label="Insight type">
    <button type="button" role="tab" data-ins="watch" aria-selected="${insTab==='watch'}">Watch-outs</button>
    <button type="button" role="tab" data-ins="analyst" aria-selected="${insTab==='analyst'}">Analyst views</button>
  </div>
  ${insTab==='watch'?`
  <div class="lv" role="group" aria-label="Filter by urgency">
    ${[['all','All',W.length,'var(--ink)'],['high','Act soon',cnt('high'),'var(--down)'],['med','Watch',cnt('med'),'var(--warn)'],['low','FYI',cnt('low'),'var(--accent-txt)']].map(([k,l,n,c])=>`<button type="button" data-lvl="${k}" aria-pressed="${k===lvl}"><b class="num" style="color:${c}">${n}</b><span>${l}</span></button>`).join('')}
  </div>
  ${list.map(flagHtml).join('')||'<div class="card empty"><p>Nothing at this level right now.</p></div>'}`:`
  <section class="sec" style="gap:0">
    <div class="an-g" style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding-bottom:6px;border-bottom:1px solid var(--line)"><span>Symbol</span><span style="text-align:right">Avg target</span><span style="text-align:right">Upside</span></div>
    ${rated.map(a=>{const an=a.analyst;const upv=(an.avg/a.price-1)*100;const lo=Math.min(an.low,a.price),hi=Math.max(an.high,a.price),sp=(hi-lo)||1;const P=x=>((x-lo)/sp*100).toFixed(1);const old=daysTo(an.asOf)<-60;
      return `<button type="button" class="an" data-open="${esc(a.id)}"><div class="an-g"><span class="m"><b>${esc(a.sym)}</b><span>${esc(rating(an))} · ${an.n} analysts</span></span><span class="t num">$${nf(an.avg)}</span><span class="pill num ${cls(upv)}">${pct(upv,1)}</span></div>
      <div class="rbar"><i style="left:${P(a.price)}%;background:var(--ink)"></i><i style="left:${P(an.avg)}%;background:var(--accent)"></i></div>
      <div class="rlab num"><span>Low $${nf(an.low,0)}</span><span>${old?'Dated · ':''}${esc(fdate(an.asOf))}</span><span>High $${nf(an.high,0)}</span></div></button>`}).join('')}
    <p class="note" style="margin-top:10px">White dot: today’s price. Purple dot: average target. ETFs don’t carry analyst ratings. Consensus from S&amp;P Global via StockAnalysis.</p>
  </section>`}
  <p class="disc">Watch-outs and analyst views are information, not advice to buy or sell. Check decisions against your own plan or with an advisor.</p>`;
}

/* ---------- Mood ---------- */
function labCls(l){l=(l||'').toLowerCase();return l.includes('bull')?'bull':l.includes('bear')?'bear':l.includes('mix')||l.includes('neutral')?'mixed':'na'}
function gaugeSvg(val){
  const cx=130,cy=135,r=110; const pt=(v,rad)=>{const a=Math.PI*(1-v/100);return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)]};
  const cols=['#D50C24','#F0A35E','#55555F','#7FD8A8','#00873C'];
  const arcs=cols.map((c,i)=>{const s=pt(i*20+1,r),e=pt(i*20+19,r);return `<path d="M${s[0].toFixed(1)} ${s[1].toFixed(1)} A${r} ${r} 0 0 1 ${e[0].toFixed(1)} ${e[1].toFixed(1)}" fill="none" stroke="${c}" stroke-width="18"/>`}).join('');
  const n=pt(Math.max(0,Math.min(100,val)),r-24);
  return `<svg viewBox="0 0 260 150" width="260" height="150" role="img" aria-label="Fear and Greed index at ${val}">${arcs}<line x1="${cx}" y1="${cy}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="#F2F2F5" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#F2F2F5"/></svg>`;
}
function renderMood(){
  const v=$('v-mood'); const S=D.sentiment;
  if(!S){v.innerHTML='<div class="card empty"><h3>No sentiment yet</h3><p>Ask Claude to update the market sentiment for your holdings.</p></div>';return}
  const m=S.mood||{}, fg=m.fearGreed, aa=m.aaii, vx=m.vix;
  const syms=new Set(D.assets.map(a=>a.sym));
  const items=(S.items||[]).filter(it=>syms.has(it.sym)||it.always);
  const fgc=fg?(fg.value<45?'var(--down)':fg.value>55?'var(--up)':'var(--ink)'):'';
  v.innerHTML=`
  <p class="note" style="margin-top:-8px">Market sentiment · as of ${esc(fdate(S.asOf))}</p>
  ${fg?`<section class="card pad gauge-c" aria-label="Fear and Greed"><span class="lbl">CNN Fear &amp; Greed</span>${gaugeSvg(fg.value)}<span class="val num" style="color:${fgc}">${fg.value}</span><b>${esc(fg.label)}</b>${fg.prev!=null?`<span class="note num">${fg.prev} a week ago</span>`:''}</section>`:''}
  ${aa||vx?`<div class="two">
    ${aa?`<section class="card" aria-label="AAII survey"><span class="k">AAII bull–bear spread</span><span class="v num ${cls(aa.bull-aa.bear)}">${aa.bull-aa.bear>0?'+':'−'}${nf(Math.abs(aa.bull-aa.bear),1)}</span><div class="stack"><span style="width:${aa.bull}%;background:var(--up)"></span><span style="width:${aa.neutral}%;background:var(--mute)"></span><span style="width:${aa.bear}%;background:var(--down)"></span></div><span class="s num">${nf(aa.bull,1)}% bull · ${nf(aa.bear,1)}% bear · avg ${nf(aa.avgBull,1)} / ${nf(aa.avgBear,1)}</span></section>`:''}
    ${vx?`<section class="card" aria-label="VIX"><span class="k">VIX volatility</span><span class="v num">${nf(vx.value)}</span><span class="s">${esc(vx.note||'')}</span></section>`:''}
  </div>`:''}
  ${m.summary?`<p class="prose">${esc(m.summary)}</p>`:''}
  ${(S.week||[]).length?`<section class="sec" style="gap:0"><div class="sec-h" style="padding-bottom:4px"><h2>What moves sentiment this week</h2></div>${S.week.map(evHtml).join('')}</section>`:''}
  <section class="sec" style="gap:0" aria-label="By holding">
    <div class="sec-h" style="padding-bottom:6px;border-bottom:1px solid var(--line)"><h2>By holding</h2><small>Stocktwits crowd score</small></div>
    ${items.map(it=>{const c=it.crowd;const k=labCls(it.overall);const bc=k==='bull'?'var(--up)':k==='bear'?'var(--down)':k==='mixed'?'var(--warn)':'var(--mute)';
      return `<div class="crowd"><div class="r1"><span class="sym">${esc(it.sym)}</span><span class="bar">${c?`<i style="width:${c.score}%;background:${bc}"></i>`:''}</span><span class="sc num">${c?c.score:'—'}</span><span class="lab ${k}">${esc((it.overall||'No data').replace(/^Leaning /i,'').replace(/ crowd$/i,''))}</span></div>
      ${it.take?`<p class="take">${esc(it.take)}</p>`:''}
      ${(it.bulls||[]).length||(it.bears||[]).length?`<details class="bb"><summary>Bulls vs bears ›</summary><div class="says"><div class="b"><h4>Bulls say</h4><ul>${(it.bulls||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="r"><h4>Bears say</h4><ul>${(it.bears||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>${it.street?`<p class="take" style="margin-top:8px"><b style="color:var(--ink)">Street:</b> ${esc(it.street)}</p>`:''}</details>`:''}
      </div>`}).join('')}
  </section>
  <p class="disc">Crowd mood often runs hot or cold and is a poor timing signal on its own. This is information, not advice to buy or sell.</p>`;
}

/* ---------- Trending ---------- */
function renderTrending(){
  const v=$('v-trending'); const T=D.trending;
  if(!T||!(T.items||[]).length){v.innerHTML='<div class="card empty"><h3>No trending board yet</h3><p>Ask Claude to refresh the Stocktwits trending board.</p></div>';return}
  const held=new Set(D.assets.map(a=>a.sym));
  const all=T.items;
  const filters=[['All',all.length],['AI-linked',all.filter(i=>i.ai).length],['Held',all.filter(i=>held.has(i.sym)).length]].filter(([k,n])=>k==='All'||n>0);
  if(!filters.some(([k])=>k===trFilter)) trFilter='All';
  const list=all.filter(i=>trFilter==='All'||(trFilter==='AI-linked'&&i.ai)||(trFilter==='Held'&&held.has(i.sym)));
  const asOf=new Date(T.asOf);
  const asOfTxt=isNaN(asOf)?'':MON[asOf.getMonth()]+' '+asOf.getDate()+', '+asOf.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
  v.innerHTML=`
  <p class="note" style="margin-top:-8px">On Stocktwits · ${esc(asOfTxt)}</p>
  ${T.note?`<p class="note">${esc(T.note)}</p>`:''}
  <div class="chips" role="group" aria-label="Filter trending">${filters.map(([k,n])=>`<button type="button" data-tf="${esc(k)}" aria-pressed="${k===trFilter}">${esc(k)} · ${n}</button>`).join('')}</div>
  ${list.map(i=>{const pos=i.high>i.low?Math.max(2,Math.min(98,(i.price-i.low)/(i.high-i.low)*100)):50;const mine=held.has(i.sym);
    return `<div class="card tr">
      <div class="tr-h"><span class="rk"><b class="num">${i.rank}</b><span>RANK</span></span>
        <div style="min-width:0"><div class="nm">${esc(i.sym)}${i.ai?'<span class="calltag">AI</span>':''}${mine?'<span class="calltag">YOU HOLD</span>':''}</div><div class="sub">${esc(i.name)}</div></div>
        <div class="px"><span class="num" style="font-weight:600">$${nf(i.price)}</span><span class="pill num ${cls(i.chgPct)}">${pct(i.chgPct)}</span></div></div>
      <p>${esc(i.about)}</p>
      <p class="why"><b>Why it’s trending</b>${esc(i.why)}</p>
      <div class="meta"><span class="lab ${labCls(i.sentiment.label)}" style="min-width:0;padding:3px 8px;font-size:11px">Crowd ${esc(i.sentiment.label.toLowerCase())} · ${i.sentiment.score}</span><span class="mpill">${esc(i.chatter.label)} chatter</span>${(i.tags||[]).filter(t=>!t.startsWith('AI')).map(t=>`<span class="mpill">${esc(t)}</span>`).join('')}</div>
      <div class="dr"><span class="num">$${nf(i.low)}</span><span class="bar" title="Day range"><i style="left:${pos.toFixed(1)}%"></i></span><span class="num">$${nf(i.high)}</span></div>
      <div class="tr-f"><span>${compact(i.watchers)} watchers · ${compact(i.volume)} shares traded</span><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">Stocktwits ›</a></div>
    </div>`}).join('')||'<div class="card empty"><p>Nothing on the board matches this filter.</p></div>'}
  <p class="disc">Trending means people are talking about a stock, not that it’s a good buy. This is information, not advice to buy or sell.</p>
  <p class="srcs">Source: <a href="${esc(safeUrl(T.src))}" target="_blank" rel="noopener">${esc(T.source||'Stocktwits')}</a> · prices at the ${esc(fdate(T.priceAsOf||D.asOf))} close</p>`;
}

/* ---------- News ---------- */
function renderNews(){
  const v=$('v-news'); const arts=D.articles||[];
  const tags=['All',...new Set(arts.flatMap(a=>a.syms||[]))];
  if(!tags.includes(newsFilter)) newsFilter='All';
  const list=arts.filter(a=>newsFilter==='All'||(a.syms||[]).includes(newsFilter)).sort((a,b)=>b.date.localeCompare(a.date));
  v.innerHTML=`<div class="chips" role="group" aria-label="Filter by holding">${tags.map(t=>`<button type="button" data-nf="${esc(t)}" aria-pressed="${t===newsFilter}">${esc(t)}</button>`).join('')}</div>
  <section class="sec" style="gap:0">${list.map((a,i)=>artHtml(a,i===0)).join('')||'<div class="card empty"><p>No articles for this holding yet.</p></div>'}</section>`;
}

/* ---------- Quote sheet ---------- */
function openDetail(id){
  const {A}=derive(D); const a=A.find(x=>x.id===id); if(!a) return;
  openId=id; const s=$('sheet'); const isOpt=a.kind==='option';
  const h=sliceRange(a.history,qRange);
  const hv=(a.history||[]).map(p=>p[1]);
  const first=h.length?h[0][1]:a.price; const rc=a.price-first, rp=first?(rc/first)*100:0;
  const dchg=a.price-a.prev;
  const refs=[]; if(h.length>1) refs.push({v:first,color:'#8A8A96'});
  if(isOpt) refs.push({v:a.strike,color:'var(--accent-txt)',label:`YOUR $${fk(a.strike)} STRIKE`,dash:'6 4'});
  const an=a.analyst;
  const ev=(D.events||[]).find(e=>e.sym===a.sym&&daysTo(e.date)>=0);
  const flags=(D.watch||[]).filter(w=>w.sym&&w.sym.split(/[^A-Z]+/).includes(a.sym));
  const arts=(D.articles||[]).filter(x=>(x.syms||[]).includes(a.sym)).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,4);
  const stats=[['Prev close',nf(a.prev)],[ev?'Next event':'Exchange',ev?fdate(ev.date):(a.exch||'—')],['2M high',hv.length?nf(Math.max(...hv)):'—'],['2M low',hv.length?nf(Math.min(...hv)):'—']];
  if(an){stats.push(['Avg target',nf(an.avg)],['Rating',rating(an)])}
  let pos;
  if(isOpt){const pl=a.cost?a.mark-a.cost:null;const otm=a.strike-a.price;
    pos=`<section class="card pad" style="display:flex;flex-direction:column;gap:14px" aria-label="Your position">
      <div class="pos-h"><h2>Your position</h2><span style="display:flex;align-items:center;gap:4px">${eyeBtn()}<span class="badge">${esc(a.positions.map(p=>p.acct).join(' + '))} · ${a.contracts||a.qty} CALL</span></span></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span class="note" style="font-size:13px">${esc(a.sym)} $${fk(a.strike)} call · ${esc(fdateY(a.expiry))}</span>
        <span class="num" style="font-size:26px;font-weight:800">${hidden?MASK:money(a.mark,'USD')}</span>
        ${pl!=null?`<span class="num ${cls(pl)}" style="font-size:14px;font-weight:700">${hidden?MASK:signed(pl,'',2)} (${pct(pl/a.cost*100)}) vs cost</span>`:''}</div>
      <div class="tri"><div><span>Cost</span><b class="num">${a.cost?(hidden?MASK:nf(a.cost)):'—'}</b></div><div><span>${otm>0?'To strike':'In the money'}</span><b class="num" style="color:${otm>0?'var(--warn)':'var(--up)'}">${otm>0?'+':''}${nf(Math.abs(otm))}</b></div><div><span>Days left</span><b class="num">${Math.max(0,daysTo(a.expiry))}</b></div></div>
      <p class="note">Mark from the last Wealthsimple update. Option prices often swing sharply on results; a long call can lose its full premium.</p></section>`;
  }else{
    pos=`<section class="card pad" style="display:flex;flex-direction:column;gap:12px" aria-label="Your position">
      <div class="pos-h"><h2>Your position</h2>${eyeBtn()}</div>
      <div style="display:flex;flex-direction:column;gap:2px"><span class="num" style="font-size:26px;font-weight:800">${hidden?MASK:money(a.value,a.cur)}</span><span class="note num">${nf(a.qty,a.qty%1?4:0)} ${a.kind==='etf'?'units':'shares'} · ${nf(a.weight,1)}% of gross</span></div>
      ${a.positions.map(p=>`<div class="acct" style="padding:10px 0"><span class="m"><b>${esc(p.acct)}</b><span class="num">${nf(p.qty,p.qty%1?4:0)} ${a.kind==='etf'?'units':'shares'}</span></span><span class="v"><b class="num">${hidden?MASK:money(p.qty*a.price,a.cur)}</b></span></div>`).join('')}
      ${a.about?`<p class="note">${esc(a.about)}</p>`:''}</section>`;
  }
  let tgt='';
  if(an){const lo=Math.min(an.low,a.price),hi=Math.max(an.high,a.price),sp=(hi-lo)||1;const P=x=>((x-lo)/sp*100).toFixed(1);const upv=(an.avg/a.price-1)*100;
    tgt=`<section class="sec" aria-label="Analyst price targets"><div class="sec-h"><h2>Analyst price targets</h2><small>${an.n} analysts · ${esc(fdate(an.asOf))}</small></div>
      <div class="tgt"><span class="track"></span><span class="band" style="left:${P(an.low)}%;right:${(100-P(an.high)).toFixed(1)}%"></span>
        <span class="dot" style="left:${P(a.price)}%;background:var(--ink)"></span><span class="tl num" style="left:${Math.max(14,Math.min(86,P(a.price)))}%">Current ${nf(a.price)}</span>
        <span class="dot" style="left:${P(an.avg)}%;background:var(--accent)"></span>
        <span class="bl num" style="left:${Math.max(10,Math.min(90,P(an.avg)))}%;color:var(--accent-txt);font-weight:700">Avg ${nf(an.avg)}</span>
      </div>
      <div class="rlab num"><span>Low ${nf(an.low,0)}</span><span>High ${nf(an.high,0)}</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="lab ${labCls(rating(an).includes('Buy')?'bull':rating(an).includes('Sell')?'bear':'mixed')}">${esc(rating(an))}</span><span class="note num" style="font-size:13px">Average target is ${pct(upv,1)} ${upv>=0?'above':'below'} the price</span></div>
      <p class="note">Information, not a recommendation to buy or sell.</p></section>`;
  }
  s.innerHTML=`<div class="sheet-h"><div class="wrap"><button type="button" class="iconbtn" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b id="sheetTitle">${esc(a.sym)}</b><span>${esc(a.exch||'')} · ${a.cur==='CAD'?'CAD':'USD'}</span></div><span style="width:44px"></span></div></div>
  <div class="wrap qbody">
    <section class="qprice" aria-label="Price"><span class="nm">${esc(isOpt?(a.underlying||a.name):a.name)}</span>
      <div class="line"><span class="px num">${nf(a.price)}</span><span class="ch num ${cls(dchg)}">${signed(dchg,'',2)} (${pct(a.stockPct)})</span></div>
      <span class="at">At close · ${esc(fdateY(D.asOf))}</span></section>
    <section class="sec" aria-label="Price chart">
      <div class="sec-h"><span class="num ${cls(rc)}" style="font-size:14px;font-weight:700">${signed(rc,'',2)} (${pct(rp)}) ${esc(qRange)}</span><small>${h.length?esc(fdate(h[0][0]))+' – '+esc(fdate(h[h.length-1][0])):''}</small></div>
      ${chart(h,{w:358,h:210,refs})}
      ${rangeBtns(['5D','1M','2M','All'],qRange,'qr')}
    </section>
    <section class="stats" aria-label="Key statistics">${stats.map(([k,v])=>`<div><span>${esc(k)}</span><b class="num">${esc(v)}</b></div>`).join('')}</section>
    ${pos}
    ${flags.length?`<section class="sec" aria-label="Watch-outs"><h2>Watch-outs</h2>${flags.map(flagHtml).join('')}</section>`:''}
    ${tgt}
    ${arts.length?`<section class="sec" aria-label="Related news" style="gap:0"><h2 style="margin-bottom:4px">Related news</h2>${arts.map(x=>artHtml(x,false)).join('')}</section>`:''}
  </div>`;
  s.hidden=false; document.body.style.overflow='hidden';
  $('back').focus({preventScroll:true});
}
function closeDetail(){$('sheet').hidden=true;openId=null;document.body.style.overflow=''}

/* ---------- shell ---------- */
const RENDER={home:renderHome,portfolio:renderPortfolio,insights:renderInsights,mood:renderMood,trending:renderTrending,news:renderNews};
function renderAll(){if(!D)return;Object.values(RENDER).forEach(f=>{try{f()}catch(e){console.error(e)}});if(openId)openDetail(openId)}
function setTab(t){if(!RENDER[t])return;tab=t;$('title').textContent=TITLES[t];document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t?'page':'false'));document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+t);window.scrollTo(0,0);try{localStorage.setItem('msh.tab2',t)}catch(e){}}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const ds=b.dataset;
  if(ds.tab) return setTab(ds.tab);
  if(ds.go) return setTab(ds.go);
  if(ds.eye){hidden=!hidden;const y=window.scrollY;renderAll();window.scrollTo(0,y);return}
  if(ds.open) return openDetail(ds.open);
  if(b.id==='back') return closeDetail();
  if(ds.hr){homeRange=ds.hr;return renderHome()}
  if(ds.qr){qRange=ds.qr;const st=$('sheet').scrollTop;openDetail(openId);$('sheet').scrollTop=st;return}
  if(ds.pf){pfTab=ds.pf;return renderPortfolio()}
  if(ds.ins){insTab=ds.ins;return renderInsights()}
  if(ds.lvl){lvl=ds.lvl;return renderInsights()}
  if(ds.nf){newsFilter=ds.nf;return renderNews()}
  if(ds.tf){trFilter=ds.tf;return renderTrending()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)closeDetail()});

function setFresh(state,txt){$('dot').className='dot'+(state==='live'?' live':'');$('freshTxt').textContent=txt}
function freshLabel(){if(!D)return'';const u=new Date(D.updatedAt);const mins=Math.round((Date.now()-u)/6e4);const ago=mins<2?'just now':mins<60?mins+' min ago':mins<1440?Math.round(mins/60)+' h ago':Math.round(mins/1440)+' d ago';return 'Updated '+ago}
function showEmpty(title,body){$('v-home').innerHTML=`<div class="card empty"><h3>${esc(title)}</h3><p>${esc(body)}</p></div><div class="card pad" style="display:flex;flex-direction:column;gap:10px"><div class="skel" style="width:60%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:40%"></div></div>`}

function accept(d){if(!d||!Array.isArray(d.assets))return false;D=d;renderAll();return true}
/* first paint from this phone's last copy, then the latest data from GitHub */
const DATA_URL='__DATA_URL__';
const BUNDLED='data.json';
try{const c=localStorage.getItem('msh.cache');if(c)accept(JSON.parse(c))}catch(e){}
try{const t=localStorage.getItem('msh.tab2');if(t&&RENDER[t])setTab(t)}catch(e){}
if(!D) showEmpty('Loading your holdings','Fetching the latest data. You need an internet connection the first time.');
let loading=false;
async function load(){
  if(loading) return; loading=true; setFresh('wait',D?freshLabel()+' · refreshing':'Loading…');
  const urls=DATA_URL.startsWith('http')?[DATA_URL+'?t='+Date.now(),BUNDLED]:[BUNDLED];
  for(const u of urls){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();
      const newer=!D||!D.updatedAt||!d.updatedAt||d.updatedAt>=D.updatedAt;
      if(newer){const y=window.scrollY;if(accept(d)){window.scrollTo(0,y);try{localStorage.setItem('msh.cache',JSON.stringify(d))}catch(e){}}}
      if(u!==BUNDLED){loading=false;setFresh('live',freshLabel());return}
    }catch(e){}
  }
  loading=false; setFresh('off',D?freshLabel()+' · offline':'Offline');
  if(!D) showEmpty('Can’t load your holdings','Check your internet connection, then tap the status at the top to retry.');
}
window.appRefresh=load;
window.appBack=()=>{if(openId){closeDetail();return true}if(tab!=='home'){setTab('home');return true}return false};
$('fresh').addEventListener('click',load);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
setInterval(()=>{if(D)$('freshTxt').textContent=freshLabel()+($('dot').classList.contains('live')?'':' · offline')},60000);
load();
})();
</script>
</body></html>
