plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aaruran.holdings'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aaruran.holdings'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        stable {
            storeFile file('holdings.keystore')
            storePassword 'holdings'
            keyAlias 'holdings'
            keyPassword 'holdings'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
