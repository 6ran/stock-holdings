name: Update holdings data

on:
  schedule:
    # 4:30 PM Toronto time on weekdays. GitHub schedules run in UTC, so both the
    # summer (EDT, 20:30 UTC) and winter (EST, 21:30 UTC) times are listed and the
    # job skips whichever one isn't 4 PM in Toronto that day.
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [positions.json]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's the 4:30 PM Toronto run
        id: when
        run: |
          # Pick the slot by Toronto's UTC offset (not the clock), so a late-starting
          # GitHub run still goes ahead and summer never runs twice.
          OFFSET=$(TZ=America/Toronto date +%z)
          SLOT="${{ github.event.schedule }}"
          echo "Toronto time: $(TZ=America/Toronto date '+%a %H:%M %Z') · slot: ${SLOT:-manual/push}"
          WANT="30 21 * * 1-5"; [ "$OFFSET" = "-0400" ] && WANT="30 20 * * 1-5"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SLOT" != "$WANT" ]; then
            echo "Not the 4:30 PM Toronto slot today; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.when.outputs.run == 'true'
        run: pip install "yfinance>=0.2.54" pandas
      - name: Rebuild data.json and push
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "holdings-bot"
          git config user.email "holdings-bot@users.noreply.github.com"
          # data.json is also edited by Claude's scheduled task (Trending tab), so
          # always rebuild on top of the latest copy and retry if a push races it.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/update.py
            if git diff --quiet -- data.json; then
              echo "No changes."
              exit 0
            fi
            git add data.json
            git commit -q -m "Update holdings data $(date -u +%F)"
            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push raced another update; retrying."
            sleep $((attempt * 15))
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
