name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-app.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Point the app at this repo's data.json
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data.json"
          sed -i "s|__DATA_URL__|${URL}|" android/app/src/main/assets/index.html
          cp data.json android/app/src/main/assets/data.json
          grep -c "raw.githubusercontent.com" android/app/src/main/assets/index.html
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publish to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyHoldings.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest MyHoldings.apk \
            --title "My Holdings app (build ${GITHUB_RUN_NUMBER})" \
            --notes "Download MyHoldings.apk on your Android phone and open it to install or update."
      - uses: actions/upload-artifact@v4
        with:
          name: MyHoldings-apk
          path: MyHoldings.apk
